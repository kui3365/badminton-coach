<!DOCTYPE html>
<html lang="zh-TW">
<head>

<meta name="apple-mobile-web-app-title" content="羽球助理">

<style>
/* ── Reset & Base ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f2f2f7; min-height: 100vh; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #f2f2f7; }

/* ── Header ── */
.header { background: #fff; border-bottom: 1px solid #e5e5ea; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left .header-title { font-size: 18px; font-weight: 600; color: #1c1c1e; }
.header-left .header-sub { font-size: 11px; color: #8e8e93; margin-top: 1px; }
.header-sync { font-size: 11px; color: #185FA5; background: #E6F1FB; border-radius: 6px; padding: 3px 9px; font-weight: 600; white-space: nowrap; }

/* ── Tab Bar ── */
.tab-bar { display: flex; border-bottom: 1px solid #e5e5ea; background: #fff; position: sticky; top: 57px; z-index: 99; }
.tab { flex: 1; padding: 10px 2px; font-size: 11.5px; color: #8e8e93; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; user-select: none; }
.tab.active { color: #185FA5; border-bottom: 2px solid #185FA5; font-weight: 600; }
.content { flex: 1; padding: 12px; }

/* ── Cards ── */
.card { background: #fff; border-radius: 12px; border: 1px solid #e5e5ea; padding: 14px; margin-bottom: 10px; }
.section-label { font-size: 11px; color: #8e8e93; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

/* ── Avatars ── */
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #E6F1FB; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #185FA5; flex-shrink: 0; }
.big-avatar { width: 54px; height: 54px; border-radius: 50%; background: #E6F1FB; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #185FA5; flex-shrink: 0; }

/* ── Student List ── */
.student-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.student-name { font-size: 15px; font-weight: 600; color: #1c1c1e; }
.student-meta { font-size: 12px; color: #8e8e93; margin-top: 2px; }
.student-id-tag { font-size: 10px; color: #c7c7cc; margin-top: 2px; font-family: monospace; }
.student-memo-preview { font-size: 12px; color: #8e8e93; margin-top: 3px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

/* ── Badges ── */
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-ok   { background: #EAF3DE; color: #3B6D11; }
.badge-low  { background: #FAEEDA; color: #854F0B; }
.badge-zero { background: #FCEBEB; color: #A32D2D; }

/* ── Metrics ── */
.metric-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.metric { background: #f2f2f7; border-radius: 10px; padding: 10px; text-align: center; }
.metric-num { font-size: 24px; font-weight: 600; color: #1c1c1e; }
.metric-lbl { font-size: 11px; color: #8e8e93; margin-top: 2px; }

/* ── Buttons ── */
.btn { display: block; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d1d1d6; background: #fff; color: #1c1c1e; font-size: 14px; cursor: pointer; text-align: center; margin-bottom: 8px; font-family: inherit; font-weight: 500; -webkit-tap-highlight-color: transparent; }
.btn:active { opacity: 0.75; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary  { background: #185FA5; color: #fff; border-color: #185FA5; font-weight: 600; }
.btn-danger   { background: #FCEBEB; color: #A32D2D; border-color: #F7C1C1; font-weight: 600; }
.btn-export   { background: #E1F5EE; color: #0F6E56; border-color: #9FE1CB; font-weight: 600; }
.btn-sync     { background: #F0E6FB; color: #6B21A8; border-color: #C4B5FD; font-weight: 600; }
.btn-notion   { background: #F5F5F4; color: #1c1c1e; border-color: #D6D3D1; font-weight: 600; }
.btn-schedule { background: #FFF3E0; color: #E65100; border-color: #FFCC80; font-weight: 600; }
.btn-diag     { background: #E6F1FB; color: #185FA5; border-color: #A8CFEE; font-weight: 600; }
.btn-gcal     { background: #E8F5E9; color: #1B5E20; border-color: #A5D6A7; font-weight: 600; }
.btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
.btn-row .btn { margin-bottom: 0; }

/* ── Inputs（手機優化：防止點擊跑版） ── */
.input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #d1d1d6; background: #fff; color: #1c1c1e; font-size: 15px; margin-bottom: 10px; font-family: inherit; -webkit-appearance: none; appearance: none; display: block; touch-action: manipulation; }
.input:focus { outline: none; border-color: #185FA5; box-shadow: 0 0 0 3px rgba(24,95,165,0.12); }
textarea.input { min-height: 72px; resize: vertical; }
.label { font-size: 13px; color: #8e8e93; margin-bottom: 4px; display: block; font-weight: 500; }
.label-req { color: #A32D2D; font-size: 11px; margin-left: 3px; }

/* 搜尋欄 */
.search-wrap { position: relative; margin-bottom: 10px; }
.search-wrap input { padding-left: 36px; margin-bottom: 0; }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #8e8e93; font-size: 15px; pointer-events: none; }

/* 欄位排列（防跑版：保持 relative 定位） */
.input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; position: relative; }
.input-row .input-group { display: flex; flex-direction: column; min-width: 0; }
.input-row .input-group .input { margin-bottom: 0; }

/* 記錄上課：時間+堂數一列 */
.input-row-t { display: grid; grid-template-columns: 1fr 1fr 68px; gap: 8px; margin-bottom: 10px; align-items: end; position: relative; }
.input-row-t .input-group { display: flex; flex-direction: column; min-width: 0; }
.input-row-t .input-group .input { margin-bottom: 0; }
/* 上課地點+堂數一列 */
.input-row-loc { display: grid; grid-template-columns: 1fr 68px; gap: 8px; margin-bottom: 10px; align-items: end; }
.input-row-loc .input-group { display: flex; flex-direction: column; min-width: 0; }
.input-row-loc .input-group .input { margin-bottom: 0; }
.input-row-loc .input-count { width: 100%; }


/* 堂數窄欄 */
.input-count { width: 100%; padding: 11px 6px; border-radius: 10px; border: 1px solid #d1d1d6; background: #fff; color: #1c1c1e; font-size: 16px; font-family: inherit; -webkit-appearance: none; text-align: center; font-weight: 700; }
.input-count:focus { outline: none; border-color: #185FA5; box-shadow: 0 0 0 3px rgba(24,95,165,0.12); }

/* ── Log Rows ── */
.log-row { display: grid; grid-template-columns: 76px 1fr 1fr 50px; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid #f2f2f7; }
.log-date     { font-size: 12px; color: #8e8e93; }
.log-time     { font-size: 12px; color: #636366; }
.log-location { font-size: 12px; color: #1c1c1e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-num      { font-size: 13px; font-weight: 600; text-align: right; }
.log-num.plus  { color: #3B6D11; }
.log-num.minus { color: #A32D2D; }
.log-header { display: grid; grid-template-columns: 76px 1fr 1fr 50px; gap: 6px; padding: 0 0 6px; border-bottom: 1px solid #e5e5ea; margin-bottom: 2px; }
.log-header span { font-size: 11px; color: #8e8e93; font-weight: 600; }
.log-header span:last-child { text-align: right; }

/* 尖峰/離峰標籤 */
.peak-tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }
.peak-on  { background: #FFE0CC; color: #7A2500; }
.peak-off { background: #D4EDDA; color: #155724; }

/* ── Notes & Memo ── */
.note-box { background: #f2f2f7; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #1c1c1e; line-height: 1.6; margin-bottom: 8px; }
.ai-tag   { font-size: 11px; color: #185FA5; font-weight: 600; margin-bottom: 4px; }
.memo-box { background: #FAEEDA; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #633806; line-height: 1.6; margin-bottom: 8px; font-style: italic; }

/* ── Misc UI ── */
.back-btn { font-size: 14px; color: #185FA5; cursor: pointer; margin-bottom: 12px; display: inline-block; font-weight: 500; }
.empty-state { text-align: center; padding: 28px 20px; color: #8e8e93; font-size: 14px; line-height: 1.6; }
.student-view-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.no-result { text-align: center; padding: 24px; color: #8e8e93; font-size: 14px; }

/* ── Sync Status ── */
.sync-status { font-size: 12px; padding: 6px 10px; border-radius: 8px; margin-top: 6px; }
.sync-ok  { background: #EAF3DE; color: #3B6D11; }
.sync-err { background: #FCEBEB; color: #A32D2D; }
.sync-ing { background: #E6F1FB; color: #185FA5; }

/* ── Toast ── */
.save-toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(60px); background: #1c1c1e; color: #fff; font-size: 13px; padding: 9px 20px; border-radius: 22px; opacity: 0; transition: opacity 0.22s, transform 0.22s; z-index: 9999; pointer-events: none; white-space: nowrap; }
.save-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Progress Bar ── */
.progress-bar  { height: 4px; background: #e5e5ea; border-radius: 2px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: #185FA5; border-radius: 2px; transition: width 0.4s; }

/* ── Config Cards ── */
.cfg-card  { background: #FFF8E6; border: 1px solid #FFD966; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.cfg-title { font-size: 13px; font-weight: 700; color: #854F0B; margin-bottom: 6px; }
.cfg-desc  { font-size: 12px; color: #633806; line-height: 1.65; margin-bottom: 10px; }
.status-ok { font-size: 12px; color: #3B6D11; margin-top: -4px; margin-bottom: 4px; }
.status-no { font-size: 12px; color: #A32D2D; margin-top: -4px; margin-bottom: 4px; }

/* ── Notion 欄位錯誤提示 ── */
.notion-field-err { background: #FCEBEB; border: 1px solid #F7C1C1; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #A32D2D; margin-top: 8px; line-height: 1.7; }
.notion-field-ok  { background: #EAF3DE; border: 1px solid #B8DFA0; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #3B6D11; margin-top: 8px; }
.notion-field-warn { background: #FFF3CD; border: 1px solid #FFD966; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #856404; margin-top: 8px; line-height: 1.7; }

/* ── Diagnostic ── */
.diag-box  { border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 12px; line-height: 1.8; }
.diag-step { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.diag-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.diag-text { color: #1c1c1e; }
.diag-err  { background: #FCEBEB; border: 1px solid #F7C1C1; }
.diag-ok   { background: #EAF3DE; border: 1px solid #B8DFA0; }
.diag-ing  { background: #E6F1FB; border: 1px solid #A8CFEE; }
.diag-warn { background: #FFF3CD; border: 1px solid #FFD966; color: #856404; }

/* ── 月曆樣式 ── */
.date-nav     { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.date-nav-btn { background: #fff; border: 1px solid #e5e5ea; border-radius: 8px; padding: 8px 16px; font-size: 20px; cursor: pointer; color: #185FA5; line-height: 1; }
.date-nav-btn:active { background: #E6F1FB; }
.date-center  { text-align: center; flex: 1; }
.date-display { font-size: 17px; font-weight: 700; color: #1c1c1e; }
.today-btn    { font-size: 11px; color: #185FA5; background: #E6F1FB; border: none; border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-top: 5px; font-family: inherit; display: inline-block; }

.cal-headers    { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
.cal-header-cell{ text-align: center; font-size: 10px; color: #8e8e93; font-weight: 700; padding: 3px 0; }
.cal-days       { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-cell { min-height: 48px; border-radius: 8px; background: #f2f2f7; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 2px; transition: opacity 0.12s; -webkit-tap-highlight-color: transparent; }
.cal-cell:active   { opacity: 0.55; }
.cal-empty { background: transparent !important; cursor: default; border: none !important; }
.cal-day-num { font-size: 13px; font-weight: 500; color: #636366; line-height: 1; }
.cal-count   { font-size: 10px; font-weight: 700; color: #185FA5; background: #E6F1FB; border-radius: 8px; padding: 1px 5px; margin-top: 3px; }
.cal-cell.cal-today              { border: 2px solid #185FA5; }
.cal-cell.cal-today .cal-day-num { color: #185FA5; font-weight: 700; }
.cal-cell.cal-selected                 { background: #185FA5 !important; border-color: #185FA5 !important; }
.cal-cell.cal-selected .cal-day-num   { color: #fff; }
.cal-cell.cal-selected .cal-count     { background: rgba(255,255,255,0.28); color: #fff; }
.cal-cell.cal-has-class                { background: #E6F1FB; }
.cal-cell.cal-has-class .cal-day-num  { color: #185FA5; }

/* ── 選取日期資訊列 ── */
.sel-date-bar { background: #E6F1FB; border-radius: 8px; padding: 7px 12px; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; color: #185FA5; }

/* ── Schedule Items ── */
.schedule-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f2f2f7; }
.schedule-item:last-child { border-bottom: none; }
.schedule-time-col   { min-width: 78px; }
.schedule-time-start { font-size: 15px; font-weight: 700; color: #185FA5; }
.schedule-time-end   { font-size: 11px; color: #8e8e93; }
.schedule-info  { flex: 1; min-width: 0; }
.schedule-name  { font-size: 14px; font-weight: 600; color: #1c1c1e; }
.schedule-loc   { font-size: 12px; color: #8e8e93; margin-top: 2px; }
.schedule-note  { font-size: 12px; color: #636366; margin-top: 2px; font-style: italic; }
.schedule-modified { font-size: 10px; color: #E65100; background: #FFF3E0; border-radius: 4px; padding: 1px 5px; margin-top: 3px; display: inline-block; }
.schedule-synced { font-size: 10px; color: #1B5E20; background: #E8F5E9; border-radius: 4px; padding: 1px 5px; margin-top: 3px; display: inline-block; }
.schedule-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: flex-start; }

.icon-btn { background: none; border: 1px solid #e5e5ea; border-radius: 7px; padding: 5px 7px; font-size: 13px; cursor: pointer; color: #636366; -webkit-tap-highlight-color: transparent; }
.icon-btn:active { background: #f2f2f7; }
.icon-btn.del    { border-color: #F7C1C1; color: #A32D2D; }
.icon-btn.gcal   { border-color: #A5D6A7; color: #1B5E20; }
.icon-btn.modified { border-color: #FFCC80; color: #E65100; }

/* ── Modal（手機優化） ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 500; overflow-y: auto; padding: 20px 12px; -webkit-overflow-scrolling: touch; }
.modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
.modal-box { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 440px; margin: auto; position: relative; }
.modal-title { font-size: 16px; font-weight: 700; color: #1c1c1e; margin-bottom: 14px; }
.modal-btn-row { display: flex; gap: 8px; margin-top: 4px; }
.modal-btn-row .btn { margin-bottom: 0; }

/* ── ID tag ── */
.id-chip { font-size: 10px; color: #8e8e93; background: #f2f2f7; border-radius: 5px; padding: 1px 6px; font-family: monospace; display: inline-block; margin-top: 3px; }
</style>

<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-title">🏸 羽球教練助理</div>
      <div class="header-sub" id="header-sub">v8 · 正式版</div>
    </div>
    <div class="header-sync" id="header-sync" style="display:none">⏳ 同步中</div>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tab-students" onclick="switchTab('students')">學生列表</div>
    <div class="tab" id="tab-schedule" onclick="switchTab('schedule')">排課</div>
    <div class="tab" id="tab-record" onclick="switchTab('record')">記錄上課</div>
    <div class="tab" id="tab-sync" onclick="switchTab('sync')">設定</div>
  </div>
  <div class="content" id="main-content"></div>
</div>
<div class="save-toast" id="save-toast"></div>
<div class="modal-overlay" id="schedule-modal" onclick="onModalBgClick(event)">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">新增排課</div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
//  Notion API Proxy（透過 Vercel API Route）
// ══════════════════════════════════════════
const API_BASE = '/api/notion';

async function notionRequest(path, method = 'GET', body = null) {
  const token = getCfg(SK_NOTION_TOK);
  if (!token) throw new Error('尚未設定 Notion Token，請到「設定」填入');
  const res = await fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, method, token, body }),
  });
  const data = await res.json();
  if (!res.ok) {
    if (res.status === 401) throw new Error('Token 無效（401），請重新設定');
    if (res.status === 403) throw new Error('無存取權（403），請把 Integration 加進資料庫');
    if (res.status === 404) throw new Error('找不到資料庫（404），請確認 ID 正確且已加入 Integration');
    throw new Error(data.message || data.error || 'HTTP ' + res.status);
  }
  return data;
}

// ══ 工具函式 ══════════════════════════════
function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function today() { return new Date().toISOString().slice(0, 10); }

function nowTimeRounded() {
  return String(new Date().getHours()).padStart(2,'0') + ':00';
}

function addHoursToRounded(timeStr, hours) {
  const h = parseInt(timeStr.split(':')[0], 10);
  return String((h + hours) % 24).padStart(2,'0') + ':00';
}

function formatTimeRange(s, e) {
  if (s && e) return s + ' – ' + e;
  if (s) return s;
  return '—';
}

function addDays(d, n) {
  const dt = new Date(d + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  return dt.toISOString().slice(0, 10);
}

function formatDbId(id) {
  const clean = id.replace(/-/g, '');
  if (clean.length === 32) return clean.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5');
  return id;
}

function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  const names = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  return y + '年' + names[m - 1];
}

function weekdayLabel(dateStr) {
  return '日一二三四五六'[new Date(dateStr + 'T00:00:00').getDay()];
}

// ══ 尖峰/離峰 扣堂係數設定（教練可依需求調整） ══
// 若尖峰扣2堂、離峰扣1堂，可改為 PEAK_DEDUCT=2, OFFPEAK_DEDUCT=1

// ══ 載入/儲存 ═════════════════════════════
function loadStudents() {
  try {
    const raw = localStorage.getItem(SK_STUDENTS);
    if (raw) {
      const parsed = JSON.parse(raw);
      // ★ 遷移：若舊資料缺 uuid / logId，自動補上
      parsed.forEach(s => {
        if (!s.uuid) s.uuid = generateUUID();
        s.logs = s.logs.map(l => ({
          logId:     l.logId     || generateUUID(),
          timeStart: l.timeStart !== undefined ? l.timeStart : (l.time || ''),
          timeEnd:   l.timeEnd   !== undefined ? l.timeEnd   : '',
          location:  l.location  || '',
          date:      l.date,
          type:      l.type,
          delta:     l.delta,
          peakType:  l.peakType  || '',
          note:      l.note      || ''
        }));
        if (!s.updatedAt) s.updatedAt = s.logs.length ? s.logs[0].date : today();
      });
      return parsed;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
}

function saveStudents(silent) {

}

function getRemaining(s) { return s.totalBought - s.used; }

function getBadge(rem) {
  if (rem <= 0) return '<span class="badge badge-zero">已用完</span>';
  if (rem <= 2) return '<span class="badge badge-low">剩 ' + rem + ' 堂</span>';
  return '<span class="badge badge-ok">剩 ' + rem + ' 堂</span>';
}

function switchTab(t) {
  state.tab = t; state.view = 'list';
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + t).classList.add('active');
  render();
}

function render() {
  const c = document.getElementById('main-content');
  if (state.tab === 'students') {
    state.view === 'detail' && state.selectedStudent ? renderDetail(c) : renderList(c);
  } else if (state.tab === 'schedule') {
    renderSchedule(c);
  } else if (state.tab === 'record') {
    renderRecord(c);
  } else {
    renderSettings(c);
  }
}

function renderList(c) {
  const low     = state.students.filter(s => getRemaining(s) <= 2).length;
  const keyword = state.search.trim();
  const filtered = keyword
    ? state.students.filter(s => s.name.includes(keyword))
    : [...state.students];

  // 依最近活動時間排序（updatedAt 越新越前）
  filtered.sort((a, b) => {
    const da = a.updatedAt || (a.logs.length ? a.logs[0].date : '0000-00-00');
    const db = b.updatedAt || (b.logs.length ? b.logs[0].date : '0000-00-00');
    return db.localeCompare(da);
  });

  c.innerHTML = `
    <div class="metric-row">
      <div class="metric"><div class="metric-num">${state.students.length}</div><div class="metric-lbl">學生</div></div>
      <div class="metric"><div class="metric-num" style="color:#A32D2D">${low}</div><div class="metric-lbl">課堂不足</div></div>
      <div class="metric"><div class="metric-num">${state.students.reduce((a, s) => a + getRemaining(s), 0)}</div><div class="metric-lbl">總剩餘堂</div></div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="input" type="text" id="search-input" placeholder="搜尋學生姓名..." value="${keyword}" oninput="onSearch(this.value)">
    </div>
    ${filtered.length === 0
      ? `<div class="no-result">找不到「${keyword}」的學生</div>`
      : filtered.map(s => `
        <div class="card" onclick="openStudent(${s.id})">
          <div class="student-row">
            <div class="avatar">${s.initials}</div>
            <div style="flex:1;min-width:0">
              <div class="student-name">${s.name}</div>
              <div class="student-meta">共購 ${s.totalBought} 堂・已上 ${s.used} 堂</div>
              <div class="student-id-tag">ID: ${s.uuid ? s.uuid.slice(0,8) : '—'}</div>
              ${s.memo ? `<div class="student-memo-preview">${s.memo}</div>` : ''}
            </div>
            ${getBadge(getRemaining(s))}
          </div>
        </div>`).join('')}
    <button class="btn" style="margin-top:4px" onclick="addStudent()">+ 新增學生</button>`;
}

function onSearch(val) {

}

function buildMonthCalendar(yearMonth) {
  const [year, month] = yearMonth.split('-').map(Number);
  const firstDay     = new Date(year, month - 1, 1);
  const daysInMonth  = new Date(year, month, 0).getDate();
  const startDow     = (firstDay.getDay() + 6) % 7;
  const todayStr     = today();

  const headers = ['一','二','三','四','五','六','日']
    .map(d => `<div class="cal-header-cell">${d}</div>`).join('');

  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<div class="cal-cell cal-empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds    = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = state.schedule.filter(x => x.date === ds).length;
    const isToday = ds === todayStr;
    const isSel   = ds === state.scheduleDate;
    let cls = 'cal-cell';
    if (isSel)              cls += ' cal-selected';
    else if (count > 0)     cls += ' cal-has-class';
    if (isToday && !isSel)  cls += ' cal-today';
    cells += `<div class="${cls}" onclick="selectScheduleDate('${ds}')">
      <div class="cal-day-num">${d}</div>
      ${count > 0 ? `<div class="cal-count">${count}</div>` : ''}
    </div>`;
  }
  return `<div class="cal-headers">${headers}</div><div class="cal-days">${cells}</div>`;
}

function renderSchedule(c) {
  const sel      = state.scheduleDate;
  const todayStr = today();
  const dayItems = state.schedule
    .filter(x => x.date === sel)
    .sort((a, b) => (a.timeStart || '').localeCompare(b.timeStart || ''));

  const itemsHtml = dayItems.length === 0
    ? `<div class="empty-state" style="padding:16px 0">這天沒有排課<br><small style="color:#c7c7cc">點上方月曆選擇日期，或直接新增</small></div>`
    : dayItems.map(item => {
        const stu = state.students.find(s => s.id === item.studentId);
        const gcalIconClass = item.modified ? 'icon-btn gcal modified' : 'icon-btn gcal';
        const gcalTitle = item.modified ? '⚠️ 已修改，點擊產生含提醒的新行事曆連結' : '加入 Google 行事曆';
        return `<div class="schedule-item">
          <div class="schedule-time-col">
            <div class="schedule-time-start">${item.timeStart || '—'}</div>
            <div class="schedule-time-end">${item.timeEnd ? '至 ' + item.timeEnd : ''}</div>
          </div>
          <div class="schedule-info">
            <div class="schedule-name">${item.studentName}</div>
            <div class="schedule-loc">${item.location || '未設定地點'} · 剩 ${stu ? getRemaining(stu) : '?'} 堂</div>
            ${item.note ? `<div class="schedule-note">${item.note}</div>` : ''}
            ${item.modified ? `<div class="schedule-modified">⚠️ 行程已修改，請更新行事曆</div>` : ''}
            ${item.gcalSynced && !item.modified ? `<div class="schedule-synced">✅ 已加入 Google 行事曆</div>` : ''}
          </div>
          <div class="schedule-actions">
            <button class="${gcalIconClass}" title="${gcalTitle}" onclick="openGoogleCal('${item.id}')">📅</button>
            <button class="icon-btn" onclick="openEditSchedule('${item.id}')">✏️</button>
            <button class="icon-btn del" onclick="deleteScheduleItem('${item.id}')">🗑</button>
          </div>
        </div>`;
      }).join('');

  const selLabel = sel
    ? sel.replace(/-/g, '/') + '（週' + weekdayLabel(sel) + '）'
    : '選擇日期';

  c.innerHTML = `
    <div class="card">
      <div class="date-nav">
        <button class="date-nav-btn" onclick="shiftScheduleMonth(-1)">‹</button>
        <div class="date-center">
          <div class="date-display">${monthLabel(state.scheduleMonth)}</div>
          ${state.scheduleMonth !== todayStr.slice(0, 7)
            ? `<button class="today-btn" onclick="goToToday()">回到本月</button>`
            : ''}
        </div>
        <button class="date-nav-btn" onclick="shiftScheduleMonth(1)">›</button>

function selectScheduleDate(d) {
  if (!d) return;
  state.scheduleDate  = d;
  state.scheduleMonth = d.slice(0, 7);
  render();
}

function shiftScheduleMonth(n) {
  const [y, m] = state.scheduleMonth.split('-').map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  state.scheduleMonth = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
  render();
}

function goToToday() {
  state.scheduleDate  = today();
  state.scheduleMonth = today().slice(0, 7);
  render();
}

function scheduleFromStudent(sid) {
  state.tab = 'schedule';
  state.scheduleDate  = today();
  state.scheduleMonth = today().slice(0, 7);
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-schedule').classList.add('active');
  render();
  openAddSchedule(sid);
}

    <select class="input" id="sch-student">${opts}</select>

    <input class="input" type="date" id="sch-date" value="${e ? item.date : state.scheduleDate}">

      <div class="input-group">
        <label class="label">開始時間</label>
        <input class="input" type="time" id="sch-start" value="${e ? (item.timeStart || '') : (defStart || '')}" style="margin-bottom:0">
      </div>
      <div class="input-group">

function openAddSchedule(presetSid) {
  document.getElementById('modal-title').textContent = '新增排課';
  const nh = nowTimeRounded();
  const eh = addHoursToRounded(nh, 2);
  document.getElementById('modal-body').innerHTML = scheduleFormHtml(null, presetSid, nh, eh);
  document.getElementById('schedule-modal').classList.add('open');
}

function openEditSchedule(id) {
  const item = state.schedule.find(x => x.id === id);
  if (!item) return;
  document.getElementById('modal-title').textContent = '編輯排課';
  document.getElementById('modal-body').innerHTML = scheduleFormHtml(item);
  document.getElementById('schedule-modal').classList.add('open');
}

function closeScheduleModal() { document.getElementById('schedule-modal').classList.remove('open'); }
function onModalBgClick(e)    { if (e.target === document.getElementById('schedule-modal')) closeScheduleModal(); }

function saveAddSchedule() {
  const sid  = parseInt(document.getElementById('sch-student').value);
  const stu  = state.students.find(s => s.id === sid);
  const date = document.getElementById('sch-date').value || state.scheduleDate;
  state.schedule.push({
    id: String(Date.now()), studentId: sid, studentName: stu ? stu.name : '未知',
    date,
    timeStart:  document.getElementById('sch-start').value,
    timeEnd:    document.getElementById('sch-end').value,
    location:   document.getElementById('sch-loc').value.trim(),
    note:       document.getElementById('sch-note').value.trim(),
    gcalSynced: false,
    modified:   false
  });
  saveSchedule();
  state.scheduleDate  = date;
  state.scheduleMonth = date.slice(0, 7);
  closeScheduleModal();
  render();
  showToast('✅ 排課已新增・點📅可加入 Google 日曆');
}

function saveEditSchedule(id) {
  const item = state.schedule.find(x => x.id === id);
  if (!item) return;
  const sid = parseInt(document.getElementById('sch-student').value);
  const stu = state.students.find(s => s.id === sid);
  // ★ 若已同步過 Google 行事曆，標記為「已修改」
  const wasModified = item.gcalSynced ? true : false;
  Object.assign(item, {
    studentId: sid, studentName: stu ? stu.name : item.studentName,
    date:      document.getElementById('sch-date').value || item.date,
    timeStart: document.getElementById('sch-start').value,
    timeEnd:   document.getElementById('sch-end').value,
    location:  document.getElementById('sch-loc').value.trim(),
    note:      document.getElementById('sch-note').value.trim(),
    modified:  wasModified
  });
  saveSchedule();
  state.scheduleDate  = item.date;
  state.scheduleMonth = item.date.slice(0, 7);
  closeScheduleModal();
  render();
  const msg = wasModified
    ? '✅ 排課已更新・行事曆標記需更新（請點📅重新同步）'
    : '✅ 排課已更新';
  showToast(msg);
}

// ★ 刪除排課：若已同步 Google 行事曆，提醒手動刪除
function deleteScheduleItem(id) {
  const item = state.schedule.find(x => x.id === id);
  if (!item) return;
  if (!confirm('確定要刪除此排課？')) return;
  if (item.gcalSynced) {
    alert('⚠️ 請記得同步手動刪除 Google 行事曆上的行程：\n「' + item.studentName + ' - ' + item.date + ' ' + (item.timeStart || '') + '」\n\n行程備註中有 #ID:' + item.id + ' 可供辨識');
  }
  state.schedule = state.schedule.filter(x => x.id !== id);
  saveSchedule();
  render();
  showToast('🗑 排課已刪除');
}

// ★ Google 行事曆連動（路徑 B：URL Scheme）
// 修改過的行程會在備註加入警告與 ID，方便教練確認舊行程
function openGoogleCal(id) {
  const item = state.schedule.find(x => x.id === id);
  if (!item) return;

  const ds    = item.date.replace(/-/g, '');
  const start = (item.timeStart || '09:00').replace(':', '') + '00';
  const end   = (item.timeEnd   || '11:00').replace(':', '') + '00';
  const text  = encodeURIComponent('羽球課 - ' + item.studentName);
  const loc   = encodeURIComponent(item.location || '');

  // ★ 若行程已修改，在備註中加入警告訊息
  // ★ 找到對應學生，構建包含 UUID 的備註
  const student = state.students.find(s => s.id === item.studentId);
  const stuUUID = student?.uuid || '';
  
  let detailsText = '⚠️ 若需修改或刪除，請手動確認並刪除 Google 日曆上的舊行程\n';
  detailsText += '\n學員UUID: ' + (stuUUID || '未設定');
  detailsText += '\n#排課ID: ' + item.id;
  if (item.note) {
    detailsText += '\n\n備註：' + item.note;
  }
  const det = encodeURIComponent(detailsText);

  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${ds}T${start}/${ds}T${end}&location=${loc}&details=${det}`;

  // 標記已同步，清除 modified 狀態
  item.gcalSynced = true;
  item.modified   = false;
  saveSchedule();
  render();

  window.open(url, '_blank', 'noopener');
  showToast(item.modified ? '⚠️ 已開啟修改行程連結，請刪除舊行程' : '✅ 已開啟 Google 行事曆');
}

// ══════════════════════════════════════════
//  ★ Excel 備份匯出（含學員UUID + 紀錄UUID）
// ══════════════════════════════════════════
function exportExcel() {
  const header = [
    '學員UUID', '學生姓名', '紀錄UUID', '日期', '類型',
    '開始時間', '結束時間', '地點', '堂數變動', '尖峰離峰', '備註'
  ];
  const rows = [header];

  const sorted = [...state.students].sort((a, b) => a.name.localeCompare(b.name, 'zh-TW'));
  sorted.forEach(s => {
    const logsAsc = [...s.logs].reverse();
    logsAsc.forEach(l => {
      rows.push([
        s.uuid         || '',
        s.name,
        l.logId        || '',
        l.date,
        l.type,
        l.timeStart    || '',
        l.timeEnd      || '',
        l.location     || '',
        l.delta > 0 ? '+' + l.delta : String(l.delta),
        l.peakType     || '',
        l.type === '購課' ? (l.note || '') : ''
      ]);
    });
  });

  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `羽球教練備份_v8_${today()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  showToast('✅ Excel 備份已匯出（含完整 ID）');
}

  const token  = getCfg(SK_NOTION_TOK);
  const dbId   = getCfg(SK_NOTION_DB);
  const dbPur  = getCfg(SK_NOTION_DB_PUR);
  const dbCls  = getCfg(SK_NOTION_DB_CLS);
  const steps  = [];

  steps.push({ ok: !!token, label: 'Token 已填入', detail: token ? `已填入（${token.slice(0, 8)}...）` : '請先填入 Token' });
  steps.push({ ok: !!dbId,  label: '學員資料庫 ID 已填入', detail: dbId ? `已填入（${dbId.slice(0, 8)}...）` : '請先填入資料庫 ID' });

  if (!token || !dbId) {
    renderDiagResult(steps, '❌ 請先填入設定再診斷');
    btn.disabled = false; btn.textContent = '🔍 開始診斷 Notion 連線';
    return;
  }

  result.innerHTML = `<div class="diag-box diag-ing">⏳ 測試伺服器 API...</div>`;
  let apiOk = false;
  try {
    const testRes  = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: '/v1/users/me', method: 'GET', token }) });
    const testData = await testRes.json();
    if (testRes.status === 200) {
      apiOk = true;
      steps.push({ ok: true,  label: '伺服器 API 可用', detail: '✅ Vercel API Route 正常運作' });
      steps.push({ ok: true,  label: 'Token 有效', detail: '✅ 驗證成功' });
    } else if (testRes.status === 401) {
      steps.push({ ok: true,  label: '伺服器 API 可用', detail: '✅ Vercel API Route 正常運作' });
      steps.push({ ok: false, label: 'Token 有效', detail: '❌ Token 無效（401），請重新複製 Integration 的 Secret' });
    } else if (testRes.status === 404 && testData.error) {
      steps.push({ ok: false, label: '伺服器 API 可用', detail: '❌ 找不到 /api/notion。請確認已上傳 api/notion.js 並 Vercel 重新部署' });
      steps.push({ ok: false, label: 'Token 有效', detail: '⏭ 跳過（API 不可用）' });
    } else {
      steps.push({ ok: false, label: '伺服器 API 可用', detail: `❌ 回應 ${testRes.status}` });
      steps.push({ ok: false, label: 'Token 有效', detail: '⏭ 跳過' });
    }
  } catch(e) {
    steps.push({ ok: false, label: '伺服器 API 可用', detail: '❌ 無法連到 /api/notion：' + e.message });
    steps.push({ ok: false, label: 'Token 有效', detail: '⏭ 跳過' });
  }

  if (apiOk) {
    // 逐一驗證三個資料庫
    const dbConfigs = [
      { id: dbId,  label: '① 學員資料庫', fields: NOTION_REQUIRED_FIELDS.students, required: true },
      { id: dbPur, label: '② 購課紀錄資料庫', fields: NOTION_REQUIRED_FIELDS.purchase, required: false },
      { id: dbCls, label: '③ 上課紀錄資料庫', fields: NOTION_REQUIRED_FIELDS.class,    required: false },
    ];

    for (const cfg of dbConfigs) {
      if (!cfg.id) {
        if (cfg.required) {
          steps.push({ ok: false, label: cfg.label, detail: '❌ 未填入 ID' });
        } else {
          steps.push({ ok: true, label: cfg.label, detail: '⏭ 未設定（選填，跳過）' });
        }
        continue;
      }
      result.innerHTML = `<div class="diag-box diag-ing">⏳ 驗證 ${cfg.label}...</div>`;
      try {
        const dbRes  = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: '/v1/databases/' + formatDbId(cfg.id), method: 'GET', token }) });
        const dbData = await dbRes.json();
        if (dbRes.status === 200) {
          const props   = Object.keys(dbData.properties || {});
          const missing = cfg.fields.filter(f => !props.includes(f));
          if (missing.length === 0) {
            steps.push({ ok: true, label: cfg.label + ' 欄位', detail: '✅ 全部 ' + cfg.fields.length + ' 個欄位都存在' });
          } else {
            steps.push({
              ok: false, label: cfg.label + ' 缺少欄位',
              detail: `⚠️ 缺少以下欄位（請在 Notion 手動新增）：\n${missing.map(f => '・' + f).join('\n')}`
            });
          }
        } else if (dbRes.status === 404) {
          steps.push({ ok: false, label: cfg.label, detail: '❌ 找不到（404）。最常見原因：Integration 還沒加進資料庫 Connection！' });
        } else if (dbRes.status === 403) {
          steps.push({ ok: false, label: cfg.label, detail: '❌ 無存取權（403）。請到資料庫 ⋯ → Connections → 加入 Integration' });
        } else {
          steps.push({ ok: false, label: cfg.label, detail: `❌ HTTP ${dbRes.status}：${dbData.message || '未知'}` });
        }
      } catch(e) {
        steps.push({ ok: false, label: cfg.label, detail: '❌ ' + e.message });
      }
    }
  }

  const allOk = steps.every(s => s.ok);
  renderDiagResult(steps, allOk ? '✅ 全部正常！可以進行同步' : '❌ 請依上方說明修正後重試');
  btn.disabled = false; btn.textContent = '🔍 重新診斷';
}

function renderDiagResult(steps, summary) {
  const allOk = steps.every(s => s.ok);
  document.getElementById('diag-result').innerHTML = `
    <div class="diag-box ${allOk ? 'diag-ok' : 'diag-err'}" style="margin-bottom:8px"><strong>${summary}</strong></div>
    ${steps.map(s => `<div class="diag-step"><div class="diag-icon">${s.ok ? '✅' : '❌'}</div>
      <div class="diag-text"><strong>${s.label}</strong><br><span style="color:#636366;white-space:pre-line">${s.detail}</span></div></div>`).join('')}
    ${!allOk ? `<div class="diag-box diag-warn" style="margin-top:10px;font-size:12px">
      <strong>💡 最常見問題：Integration 沒加進資料庫</strong><br>
      Notion 資料庫頁面 → 右上角 <strong>⋯</strong> → <strong>Connections</strong> → 找到你的 Integration → <strong>Confirm</strong>
    </div>` : ''}`;
}

// ── 學員基本資訊 DB ──
async function findOrCreateStudentPage(student) {
  const dbId = formatDbId(getCfg(SK_NOTION_DB));
  const map  = loadNotionMap(SK_NOTION_MAP);
  if (map[student.uuid || student.id]) return map[student.uuid || student.id];

  const data = await notionRequest('/v1/databases/' + dbId + '/query', 'POST',
    { filter: { property: '姓名', title: { equals: student.name } } });
  let pageId;
  if (data.results?.length > 0) {
    pageId = data.results[0].id;
  } else {
    const c = await notionRequest('/v1/pages', 'POST', {
      parent: { database_id: dbId },
      properties: {
        姓名:    { title: [{ text: { content: student.name } }] },
        學員ID:  { rich_text: [{ text: { content: student.uuid || String(student.id) } }] }
      }
    });
    pageId = c.id;
  }
  const key = student.uuid || student.id;
  map[key] = pageId;
  saveNotionMap(SK_NOTION_MAP, map);
  return pageId;
}

async function updateStudentPage(student, pageId) {
  const rem = getRemaining(student);
  const ts  = new Date().toISOString().slice(0, 10) + ' ' + new Date().toTimeString().slice(0, 5);

  const allUpdates = {
    '學員ID':   { rich_text: [{ text: { content: student.uuid || String(student.id) } }] },
    '剩餘堂數': { number: rem },
    '已上堂數': { number: student.used },
    '購買堂數': { number: student.totalBought },
    '最後同步': { rich_text: [{ text: { content: ts } }] },
    '備註':     { rich_text: [{ text: { content: student.memo || '' } }] },
  };

  let existingProps = null;
  try {
    const page = await notionRequest('/v1/pages/' + pageId, 'GET');
    existingProps = Object.keys(page.properties || {});
  } catch(e) {}

  const updates = existingProps
    ? Object.fromEntries(Object.entries(allUpdates).filter(([k]) => existingProps.includes(k)))
    : allUpdates;

  const missingFields = existingProps
    ? Object.keys(allUpdates).filter(k => !existingProps.includes(k))
    : [];

  if (Object.keys(updates).length > 0) {
    await notionRequest('/v1/pages/' + pageId, 'PATCH', { properties: updates });
  }

  // 若缺少欄位，在設定頁顯示警告
  if (missingFields.length > 0) {
    const el = document.getElementById('notion-field-status');
    if (el) {
      el.innerHTML = `<div class="notion-field-warn">
        ⚠️ 學員資料庫缺少欄位，以下欄位未同步：<strong>${missingFields.join('、')}</strong><br>
        請在 Notion 資料庫新增這些欄位，或執行「診斷」查看詳細說明。
      </div>`;
    }
  }

  return missingFields;
}

// ── 購課紀錄 DB（選填） ──
async function syncPurchaseLog(student, log) {
  const dbId = getCfg(SK_NOTION_DB_PUR);
  if (!dbId || log.type !== '購課') return;
  const map = loadNotionMap(SK_NOTION_MAP_PUR);
  if (map[log.logId]) return; // 已同步過

  try {
    const c = await notionRequest('/v1/pages', 'POST', {
      parent: { database_id: formatDbId(dbId) },
      properties: {
        學員姓名:  { title:     [{ text: { content: student.name } }] },
        紀錄ID:    { rich_text: [{ text: { content: log.logId || '' } }] },
        學員ID:    { rich_text: [{ text: { content: student.uuid || String(student.id) } }] },
        尖離峰:    { select:    { name: log.peakType || '未指定' } },
        購課日期:  { date:      { start: log.date } },
        購買堂數:  { number:    log.delta },
        備註:      { rich_text: [{ text: { content: log.note || log.location || '' } }] },
      }
    });
    map[log.logId] = c.id;
    saveNotionMap(SK_NOTION_MAP_PUR, map);
  } catch(e) {
    console.warn('購課紀錄同步失敗:', e.message);
  }
}

// ── 上課紀錄 DB（選填） ──
async function syncClassLog(student, log, remaining) {
  const dbId = getCfg(SK_NOTION_DB_CLS);
  if (!dbId || log.type !== '上課') return;
  const map = loadNotionMap(SK_NOTION_MAP_CLS);
  if (map[log.logId]) return;

  try {
    const c = await notionRequest('/v1/pages', 'POST', {
      parent: { database_id: formatDbId(dbId) },
      properties: {
        學員姓名:  { title:     [{ text: { content: student.name } }] },
        紀錄ID:    { rich_text: [{ text: { content: log.logId || '' } }] },
        學員ID:    { rich_text: [{ text: { content: student.uuid || String(student.id) } }] },
        上課日期:  { date:      { start: log.date } },
        起始時間:  { rich_text: [{ text: { content: log.timeStart || '' } }] },
        結束時間:  { rich_text: [{ text: { content: log.timeEnd   || '' } }] },
        上課地點:  { rich_text: [{ text: { content: log.location  || '' } }] },
        教練備註:  { rich_text: [{ text: { content: log.note      || '' } }] },
        剩餘堂數:  { number:    remaining },
      }
    });
    map[log.logId] = c.id;
    saveNotionMap(SK_NOTION_MAP_CLS, map);
  } catch(e) {
    console.warn('上課紀錄同步失敗:', e.message);
  }
}

function addSyncLog(name, ok, msg) {
  state.syncLog.unshift({ name, ok, msg: msg || '', time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) });
}

// ★ 靜默自動同步（上課/購課後在後台執行）
async function autoSyncNotion(sid, latestLog) {
  if (!getCfg(SK_NOTION_TOK) || !getCfg(SK_NOTION_DB)) return;
  const s = state.students.find(x => x.id === sid);
  if (!s) return;

  const syncEl = document.getElementById('header-sync');
  if (syncEl) { syncEl.style.display = 'block'; syncEl.textContent = '⏳ 同步中'; }

  try {
    const pageId = await findOrCreateStudentPage(s);
    await updateStudentPage(s, pageId);

    // 同步最新一筆紀錄到對應 DB
    if (latestLog) {
      const rem = getRemaining(s);
      if (latestLog.type === '購課') await syncPurchaseLog(s, latestLog);
      if (latestLog.type === '上課') await syncClassLog(s, latestLog, rem);
    }

    addSyncLog(s.name, true);
    if (syncEl) { syncEl.textContent = '✅ 已同步'; setTimeout(() => { syncEl.style.display = 'none'; }, 3000); }
  } catch(e) {
    addSyncLog(s.name, false, e.message);
    if (syncEl) syncEl.style.display = 'none';
  }
}

async function syncAllNotion() {
  const prog = document.getElementById('sync-progress');
  const btn  = document.getElementById('sync-all-btn');
  if (prog) prog.style.display = 'block';
  if (btn)  btn.disabled = true;
  for (let i = 0; i < state.students.length; i++) {
    const s    = state.students[i];
    const fill = document.getElementById('progress-fill');
    const txt  = document.getElementById('progress-text');
    if (fill) fill.style.width = Math.round((i + 1) / state.students.length * 100) + '%';
    if (txt)  txt.textContent  = `同步 ${s.name}... (${i + 1}/${state.students.length})`;
    try {
      const pageId = await findOrCreateStudentPage(s);
      await updateStudentPage(s, pageId);
      addSyncLog(s.name, true);
    } catch(e) { addSyncLog(s.name, false, e.message); }
  }
  if (prog) prog.style.display = 'none';
  if (btn)  btn.disabled = false;
  render();
  showToast('✅ Notion 全部同步完成');
}

//  AI 筆記
// ══════════════════════════════════════════
async function generateNote(sid) {
  const s     = state.students.find(x => x.id === sid);
  const input = document.getElementById('note-input-' + sid);
  const btn   = document.getElementById('ai-btn-' + sid);
  if (!input.value.trim()) { alert('請先輸入今天的上課狀況'); return; }
  const antKey = getCfg(SK_ANT_KEY);
  if (!antKey) { alert('請先到「設定」分頁填入 Anthropic API Key'); return; }
  btn.textContent = '⏳ AI 整理中...'; btn.disabled = true;
  const prev = s.notes.slice(0, 2).map(n => n.text).join('\n');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': antKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 300,
        messages: [{ role: 'user', content: '你是羽球教練助理。根據教練的口語描述，整理成簡短學習筆記（100字以內），格式：優點・待改進・下次重點。\n教練描述：' + input.value.trim() + '\n過去筆記：' + (prev || '無') + '\n只輸出筆記內容，不要加前言。' }]
      })
    });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error?.message || 'HTTP ' + res.status); }
    const data = await res.json();
    s.notes.unshift({ date: today(), text: data.content?.[0]?.text || '整理失敗', ai: true });
    input.value = '';
    saveStudents(true);
    showToast('✅ AI 筆記整理完成');
  } catch(e) { alert('AI 連線失敗：' + e.message); }
  btn.textContent = '✨ AI 整理筆記'; btn.disabled = false; render();
}

  const warn = rem <= 2 ? `<div style="background:#FCEBEB;color:#A32D2D;border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:13px;font-weight:600;">⚠️ 課堂即將用完，請盡快購課</div>` : '';
  const html = `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${s.name} 課堂紀錄</title>
  <style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:720px;margin:40px auto;padding:0 24px;color:#1c1c1e}h1{font-size:24px;font-weight:700;margin-bottom:4px}.sub{color:#8e8e93;font-size:13px;margin-bottom:28px}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}.metric{background:#f2f2f7;border-radius:10px;padding:14px;text-align:center}.metric-num{font-size:28px;font-weight:700}.metric-lbl{font-size:11px;color:#8e8e93;margin-top:4px}.rem-ok{color:#3B6D11}.rem-low{color:#A32D2D}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th{background:#185FA5;color:#fff;padding:9px 10px;text-align:left;font-weight:600}td{padding:9px 10px;border-bottom:1px solid #f2f2f7}tr:nth-child(even) td{background:#f9f9f9}.plus{color:#3B6D11;font-weight:600}.minus{color:#A32D2D;font-weight:600}.footer{margin-top:36px;color:#c7c7cc;font-size:11px;text-align:center;border-top:1px solid #f2f2f7;padding-top:16px}.print-btn{display:block;margin:0 auto 24px;padding:10px 28px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600}@media print{.print-btn{display:none}body{margin:20px auto}}</style></head><body>
  <button class="print-btn" onclick="window.print()">🖨️ 列印 / 存成 PDF</button>
  <h1>${s.name} 課堂紀錄</h1><div class="sub">製表日期：${today()} ・ 學員ID：${s.uuid || String(s.id)}</div>
  <div class="metrics"><div class="metric"><div class="metric-num">${s.totalBought}</div><div class="metric-lbl">購買課堂</div></div><div class="metric"><div class="metric-num">${s.used}</div><div class="metric-lbl">已上課堂</div></div><div class="metric"><div class="metric-num ${rem <= 2 ? 'rem-low' : 'rem-ok'}">${rem}</div><div class="metric-lbl">剩餘課堂</div></div></div>${warn}
  <table><thead><tr><th>#</th><th>日期</th><th>開始</th><th>結束</th><th>地點</th><th>消耗</th><th>剩餘</th></tr></thead>
  <tbody>${rows.map((l, i) => `<tr><td>${l.type === '上課' ? (i + 1) : ''}</td><td>${l.date}</td><td>${l.timeStart || '—'}</td><td>${l.timeEnd || '—'}</td><td>${l.location || (l.type === '購課' ? '購課' + (l.peakType ? '・' + l.peakType : '') : '—')}</td><td class="${l.delta > 0 ? 'plus' : 'minus'}">${l.delta > 0 ? '+' : ''}${l.delta}</td><td>${l.balance}</td></tr>`).join('')}</tbody></table>
  <div class="footer">此紀錄由羽球教練助理 v7 產生</div></body></html>`;
  try {
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' }), url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch(e) {
    const win = window.open('', '_blank');
    if (win) { win.document.write(html); win.document.close(); }
    else showToast('⚠️ 請允許彈出視窗');
  }
}

function saveAntKey() {
  const raw = document.getElementById('ant-key-input').value.trim();
  if (raw.includes('•')) { showToast('⚠️ Key 未變更'); return; }
  if (!raw.startsWith('sk-ant-')) { showToast('❌ 格式不對，應以 sk-ant- 開頭'); return; }
  setCfg(SK_ANT_KEY, raw); showToast('✅ API Key 已儲存'); render();
}

function saveNotionCfg() {
  const tok = document.getElementById('notion-tok-input').value.trim();
  const db  = document.getElementById('notion-db-input').value.trim();
  const pur = document.getElementById('notion-db-pur-input').value.trim();
  const cls = document.getElementById('notion-db-cls-input').value.trim();
  if (!tok.includes('•') && tok) setCfg(SK_NOTION_TOK, tok);
  if (db)  setCfg(SK_NOTION_DB,     db);
  if (pur) setCfg(SK_NOTION_DB_PUR, pur);
  if (cls) setCfg(SK_NOTION_DB_CLS, cls);
  showToast('✅ Notion 設定已儲存'); render();
}

function saveMemo(id) {
  const s = state.students.find(x => x.id === id);
  s.memo      = document.getElementById('memo-input-' + id).value.trim();
  s.updatedAt = today();
  saveStudents(true);
  showToast('✅ 備註已儲存');
  render();
}

function deleteStudent(id) {
  const s = state.students.find(x => x.id === id);
  if (!confirm('確定要刪除「' + s.name + '」的所有資料嗎？\n此動作無法復原。')) return;
  state.students = state.students.filter(x => x.id !== id);
  saveStudents(true);
  state.view = 'list'; state.selectedStudent = null; render();
  showToast('🗑 已刪除 ' + s.name);
}

function openStudent(id) { state.selectedStudent = id; state.view = 'detail'; render(); }
function goBack()        { state.view = 'list'; state.selectedStudent = null; render(); }

// 從詳情頁快速記錄上課（-1，預設尖峰，可依需求改）
function addLesson(id) {
  const s = state.students.find(x => x.id === id);
  if (getRemaining(s) <= 0) { alert('課堂已用完，請先購課！'); return; }
  const newLog = { logId: generateUUID(), date: today(), timeStart: nowTimeRounded(), timeEnd: '', location: '', type: '上課', delta: -1, peakType: '' };
  s.used++;
  s.updatedAt = today();
  s.logs.unshift(newLog);
  saveStudents(true);
  showToast('✅ 已記錄 ' + s.name + ' 上課 1 堂');
  render();
  autoSyncNotion(id, newLog);
}

// 從詳情頁快速購課（+10）
function addPurchase(id) {
  const s = state.students.find(x => x.id === id);
  const newLog = { logId: generateUUID(), date: today(), timeStart: '', timeEnd: '', location: '', type: '購課', delta: 10, peakType: '' };
  s.totalBought += 10;
  s.updatedAt = today();
  s.logs.unshift(newLog);
  saveStudents(true);
  showToast('✅ 已為 ' + s.name + ' 新增 10 堂');
  render();
  autoSyncNotion(id, newLog);
}

function addStudent() {
  const name   = prompt('學生姓名：'); if (!name) return;
  const bought = parseInt(prompt('購買堂數：') || '10');
  const newUUID = generateUUID();
  const firstLog = { logId: generateUUID(), date: today(), timeStart: '', timeEnd: '', location: '', type: '購課', delta: bought, peakType: '' };
  state.students.push({
    id: Date.now(), uuid: newUUID, name, initials: name.slice(-1),
    totalBought: bought, used: 0, memo: '', updatedAt: today(),
    logs:  [firstLog],
    notes: []
  });
  saveStudents(true);
  showToast('✅ 已新增學生：' + name);
  render();
}

// ★ 記錄上課（含尖峰/離峰必填驗證 + 扣堂係數）
function doRecord() {
  const id       = parseInt(document.getElementById('rec-student').value);
  const s        = state.students.find(x => x.id === id);
  const count    = parseInt(document.getElementById('rec-count').value) || 1;
  const peakType = document.getElementById('rec-peak').value;

  // ★ 尖峰/離峰 必填驗證
  if (!peakType) {
    alert('請選擇「尖峰」或「離峰」！\n尖峰/離峰 為必填項目。');
    document.getElementById('rec-peak').focus();
    return;
  }

  // ★ 依尖峰/離峰計算實際扣堂數
  const deductMultiplier = peakType === '尖峰' ? PEAK_DEDUCT : OFFPEAK_DEDUCT;
  const actualDeduct = count * deductMultiplier;

  if (getRemaining(s) < actualDeduct) {
    alert('課堂不足！目前剩 ' + getRemaining(s) + ' 堂，本次需扣 ' + actualDeduct + ' 堂（' + peakType + '）');
    return;
  }

  const date     = document.getElementById('rec-date').value || today();
  const location = document.getElementById('rec-location').value.trim();

  const newLog = {
    logId:     generateUUID(),
    date,
    timeStart: document.getElementById('rec-time-start').value || '',
    timeEnd:   document.getElementById('rec-time-end').value   || '',
    location,
    type:      '上課',
    delta:     -actualDeduct,
    peakType
  };

  s.used     += actualDeduct;
  s.updatedAt = date;
  s.logs.unshift(newLog);
  saveStudents(true);

  let msg = '✅ 已記錄 ' + s.name + ' 上課 ' + count + ' 堂';
  if (actualDeduct !== count) msg += '（' + peakType + '，實扣 ' + actualDeduct + ' 堂）';
  else msg += '（' + peakType + '）';
  showToast(msg);
  render();
  autoSyncNotion(id, newLog);
}

// ★ 新增購課（尖峰/離峰必填驗證）
function doPurchase() {
  const id       = parseInt(document.getElementById('buy-student').value);
  const s        = state.students.find(x => x.id === id);
  const count    = parseInt(document.getElementById('buy-count').value) || 10;
  const peakType = document.getElementById('buy-peak').value;
  const note     = document.getElementById('buy-note').value.trim();
  const date     = document.getElementById('buy-date').value || today();

  // ★ 尖峰/離峰 必填驗證
  if (!peakType) {
    alert('請選擇「尖峰」或「離峰」！\n購課時尖峰/離峰 為必填項目。');
    document.getElementById('buy-peak').focus();
    return;
  }

  const newLog = {
    logId:     generateUUID(),
    date,
    timeStart: '', timeEnd: '',
    location:  note,
    note:      note,
    type:      '購課',
    delta:     count,
    peakType
  };

  s.totalBought += count;
  s.updatedAt    = date;
  s.logs.unshift(newLog);

  let msg = '✅ 已為 ' + s.name + ' 新增 ' + count + ' 堂';
  if (peakType) msg += '（' + peakType + '）';
  saveStudents(true);
  showToast(msg);
  render();
  autoSyncNotion(id, newLog);
}

// ══ 啟動 ══
render();

// Helper: 安全取得 Notion 屬性值
function nProp(page, key, type) {
  const p = page.properties?.[key];
  if (\!p) return '';
  if (type === 'title') return p.title?.[0]?.plain_text || '';
  if (type === 'rich_text') return p.rich_text?.[0]?.plain_text || '';
  if (type === 'number') return p.number ?? 0;
  if (type === 'date') return p.date?.start || '';
  if (type === 'select') return p.select?.name || '';
  return '';
}

// Helper: 帶分頁的 Notion 查詢
async function fetchAllNotionPages(dbId) {
  const token = getCfg(SK_NOTION_TOK);
  if (\!token) throw new Error('未設定 Notion Token');
  
  let all = [];
  let cursor = undefined;
  
  do {
    const body = { page_size: 100 };
    if (cursor) body.start_cursor = cursor;
    
    try {
      const data = await notionRequest('/v1/databases/' + formatDbId(dbId) + '/query', 'POST', body);
      all = all.concat(data.results || []);
      cursor = data.has_more ? data.next_cursor : undefined;
    } catch(e) {
      console.error('Notion fetch error:', e);
      throw e;
    }
  } while (cursor);
  
  return all;
}

// Main: 從 Notion 還原所有資料
async function restoreFromNotion() {
  const token = getCfg(SK_NOTION_TOK);
  const dbId  = getCfg(SK_NOTION_DB);
  
  if (\!token || \!dbId) {
    alert('❌ 請先設定 Notion Token 與學員資料庫 ID');
    return;
  }
  
  const btn = document.getElementById('restore-btn');
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ 還原中...';
  
  try {
    // Step 1: 取得所有學員
    const stuPages = await fetchAllNotionPages(dbId);
    
    const notionStudents = stuPages.map(p => ({
      uuid:        nProp(p, '學員ID', 'rich_text'),
      name:        nProp(p, '姓名', 'title'),
      totalBought: nProp(p, '購買堂數', 'number'),
      used:        nProp(p, '已上堂數', 'number'),
      memo:        nProp(p, '備註', 'rich_text'),
      notionPageId: p.id,
      logs: [],
      notes: []
    })).filter(s => s.name);
    
    // Step 2: 若有設定，取得購課紀錄
    const purDbId = getCfg(SK_NOTION_DB_PUR);
    if (purDbId) {
      try {
        const purPages = await fetchAllNotionPages(purDbId);
        purPages.forEach(p => {
          const stuUUID = nProp(p, '學員ID', 'rich_text');
          const stu = notionStudents.find(s => s.uuid === stuUUID);
          if (\!stu) return;
          
          stu.logs.push({
            logId:     nProp(p, '紀錄ID', 'rich_text') || generateUUID(),
            date:      nProp(p, '購課日期', 'date'),
            timeStart: '',
            timeEnd:   '',
            location:  '',
            note:      nProp(p, '備註', 'rich_text'),
            type:      '購課',
            delta:     nProp(p, '購買堂數', 'number'),
            peakType:  nProp(p, '尖離峰', 'select'),
          });
        });
      } catch(e) {
        console.warn('購課紀錄取得失敗:', e);
      }
    }
    
    // Step 3: 若有設定，取得上課紀錄
    const clsDbId = getCfg(SK_NOTION_DB_CLS);
    if (clsDbId) {
      try {
        const clsPages = await fetchAllNotionPages(clsDbId);
        clsPages.forEach(p => {
          const stuUUID = nProp(p, '學員ID', 'rich_text');
          const stu = notionStudents.find(s => s.uuid === stuUUID);
          if (\!stu) return;
          
          stu.logs.push({
            logId:     nProp(p, '紀錄ID', 'rich_text') || generateUUID(),
            date:      nProp(p, '上課日期', 'date'),
            timeStart: nProp(p, '起始時間', 'rich_text'),
            timeEnd:   nProp(p, '結束時間', 'rich_text'),
            location:  nProp(p, '上課地點', 'rich_text'),
            note:      nProp(p, '教練備註', 'rich_text'),
            type:      '上課',
            delta:     -1,
            peakType:  '',
          });
        });
      } catch(e) {
        console.warn('上課紀錄取得失敗:', e);
      }
    }
    
    // 排序日誌、計算 updatedAt
    notionStudents.forEach(s => {
      s.logs.sort((a, b) => b.date.localeCompare(a.date));
      s.updatedAt = s.logs[0]?.date || today();
      s.initials  = s.name.slice(-1);
    });
    
    // Step 4: 與本機合併
    let added = 0, updated = 0;
    const existingMap = {};
    state.students.forEach(s => { if (s.uuid) existingMap[s.uuid] = s; });
    
    notionStudents.forEach(ns => {
      if (\!ns.uuid) return;
      const local = existingMap[ns.uuid];
      
      if (local) {
        // 更新現有學員
        local.name = ns.name;
        local.totalBought = ns.totalBought;
        local.used = ns.used;
        local.memo = ns.memo || local.memo;
        
        // 合併日誌：只加入本機沒有的 logId
        const localLogIds = new Set(local.logs.map(l => l.logId));
        ns.logs.forEach(nl => {
          if (\!localLogIds.has(nl.logId)) {
            local.logs.push(nl);
            localLogIds.add(nl.logId);
          }
        });
        
        local.logs.sort((a, b) => b.date.localeCompare(a.date));
        local.updatedAt = local.logs[0]?.date || local.updatedAt;
        updated++;
      } else {
        // 新增學員
        ns.id = Date.now() + Math.random();
        state.students.push(ns);
        existingMap[ns.uuid] = ns;
        added++;
      }
    });
    
    // 儲存
    saveStudents(true);
    
    // 更新 Notion mapping
    const map = loadNotionMap(SK_NOTION_MAP);
    notionStudents.forEach(ns => {
      if (ns.uuid && ns.notionPageId) {
        map[ns.uuid] = ns.notionPageId;
      }
    });
    saveNotionMap(SK_NOTION_MAP, map);
    
    render();
    showToast(`✅ 還原完成！新增 ${added} 位・更新 ${updated} 位學生`);
    
    const msg = `☁️ Notion 雲端還原完成！

✅ 新增學生：${added} 位
🔄 更新學生：${updated} 位

所有資料已合併至本機，換手機/換瀏覽器也能找回資料。`;
    alert(msg);
    
  } catch(e) {
    console.error('還原失敗:', e);
    alert('❌ 還原失敗：' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}
