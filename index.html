    <div class="tab active" id="tab-students" onclick="switchTab('students')">學生列表</div>
    <div class="tab" id="tab-schedule" onclick="switchTab('schedule')">排課</div>
    <div class="tab" id="tab-record" onclick="switchTab('record')">記錄上課</div>
    <div class="tab" id="tab-sync" onclick="switchTab('sync')">設定</div>

<script>
// ════════════════════════════════════════════
// ★ 核心改動：透過 Vercel API Route 呼叫 Notion
//   完全解決 CORS 問題
// ════════════════════════════════════════════

// 自動偵測 API 路徑（本地開發 or Vercel 生產環境都能用）
const API_BASE = '/api/notion';

async function notionRequest(path, method = 'GET', body = null) {
  const token = getCfg(SK_NOTION_TOK);
  if (!token) throw new Error('尚未設定 Notion Token，請到「設定」填入');

  const res = await fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, method, token, body }),
  });

  const data = await res.json();
  if (!res.ok) {
    if (res.status === 401) throw new Error('Token 無效（401），請重新設定');
    if (res.status === 403) throw new Error('無存取權（403），請把 Integration 加進資料庫');
    if (res.status === 404) throw new Error('找不到資料庫（404），請確認 ID 正確且已加入 Integration');
    throw new Error(data.message || data.error || 'HTTP ' + res.status);
  }
  return data;
}

// ── 工具函式 ──
function today() { return new Date().toISOString().slice(0,10); }
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function formatTimeRange(s, e) {
  if (s && e) return s + ' – ' + e;
  if (s) return s;
  return '—';
}
function addDays(d, n) {
  const dt = new Date(d + 'T00:00:00');
  dt.setDate(dt.getDate() + n);
  return dt.toISOString().slice(0,10);
}
function getWeekDates(d) {
  const dt = new Date(d + 'T00:00:00');
  const day = dt.getDay();
  const mon = new Date(dt); mon.setDate(dt.getDate() - ((day + 6) % 7));
  return Array.from({length:7}, (_,i) => {
    const x = new Date(mon); x.setDate(mon.getDate() + i);
    return x.toISOString().slice(0,10);
  });
}
function formatDbId(id) {
  const clean = id.replace(/-/g, '');
  if (clean.length === 32) return clean.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/, '$1-$2-$3-$4-$5');
  return id;
}

// ── LocalStorage keys ──
const SK_STUDENTS   = 'bmc_students';
const SK_NOTION_MAP = 'bmc_notion_map';
const SK_SCHEDULE   = 'bmc_schedule';
const SK_ANT_KEY    = 'bmc_anthropic_key';
const SK_NOTION_TOK = 'bmc_notion_token';
const SK_NOTION_DB  = 'bmc_notion_db_id';

function getCfg(key) { return localStorage.getItem(key) || ''; }
function setCfg(key, val) { localStorage.setItem(key, val); }

const DEFAULT_STUDENTS = [
  { id:1, name:'小明', initials:'明', totalBought:20, used:14, memo:'電腦工程師，週末才有空，個性認真',
    logs:[
      {date:'2024-06-10',timeStart:'10:00',timeEnd:'12:00',location:'體育館A場',type:'上課',delta:-1},
      {date:'2024-06-03',timeStart:'10:00',timeEnd:'12:00',location:'體育館A場',type:'上課',delta:-1},
      {date:'2024-05-28',timeStart:'09:30',timeEnd:'11:30',location:'體育館B場',type:'上課',delta:-1},
      {date:'2024-05-20',timeStart:'',timeEnd:'',location:'',type:'購課',delta:10},
      {date:'2024-05-10',timeStart:'10:00',timeEnd:'12:00',location:'體育館A場',type:'上課',delta:-1},
      {date:'2024-04-18',timeStart:'',timeEnd:'',location:'',type:'購課',delta:10},
      {date:'2024-04-10',timeStart:'10:00',timeEnd:'12:00',location:'體育館A場',type:'上課',delta:-1}
    ],
    notes:[{date:'2024-06-10',text:'優點：反手擊球進步明顯。待改進：步伐移動稍慢，後場銜接不夠流暢。下次重點：後場高遠球落點練習。',ai:true}] },
  { id:2, name:'小華', initials:'華', totalBought:10, used:9, memo:'台北體大體保生，基礎很好，主攻殺球',
    logs:[
      {date:'2024-06-09',timeStart:'14:00',timeEnd:'16:00',location:'體育館C場',type:'上課',delta:-1},
      {date:'2024-06-02',timeStart:'14:00',timeEnd:'16:00',location:'體育館C場',type:'上課',delta:-1},
      {date:'2024-05-25',timeStart:'',timeEnd:'',location:'',type:'購課',delta:10}
    ],
    notes:[{date:'2024-06-09',text:'優點：發球穩定，戰術意識不錯。待改進：殺球力道不足，手腕爆發力需加強。下次重點：手腕爆發力訓練。',ai:true}] },
  { id:3, name:'小美', initials:'美', totalBought:15, used:5, memo:'',
    logs:[
      {date:'2024-06-08',timeStart:'11:00',timeEnd:'13:00',location:'社區球場',type:'上課',delta:-1},
      {date:'2024-05-30',timeStart:'11:00',timeEnd:'13:00',location:'社區球場',type:'上課',delta:-1},
      {date:'2024-05-15',timeStart:'',timeEnd:'',location:'',type:'購課',delta:15}
    ],
    notes:[] },
];

function loadStudents() {
  try {
    const raw = localStorage.getItem(SK_STUDENTS);
    if (raw) {
      const parsed = JSON.parse(raw);
      parsed.forEach(s => {
        s.logs = s.logs.map(l => ({
          timeStart: l.timeStart !== undefined ? l.timeStart : (l.time || ''),
          timeEnd: l.timeEnd !== undefined ? l.timeEnd : '',
          location: l.location || '',
          date: l.date, type: l.type, delta: l.delta
        }));
      });
      return parsed;
    }
  } catch(e) {}
  return DEFAULT_STUDENTS;
}
function saveStudents() {
  try { localStorage.setItem(SK_STUDENTS, JSON.stringify(state.students)); showToast('✅ 已自動儲存'); } catch(e) {}
}
function loadNotionMap() { try { return JSON.parse(localStorage.getItem(SK_NOTION_MAP) || '{}'); } catch { return {}; } }
function saveNotionMap(m) { localStorage.setItem(SK_NOTION_MAP, JSON.stringify(m)); }
function loadSchedule() { try { return JSON.parse(localStorage.getItem(SK_SCHEDULE) || '[]'); } catch { return []; } }
function saveSchedule() { try { localStorage.setItem(SK_SCHEDULE, JSON.stringify(state.schedule)); } catch(e) {} }

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('save-toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

const state = {
  tab: 'students', selectedStudent: null, view: 'list', search: '',
  students: loadStudents(), syncLog: [], schedule: loadSchedule(), scheduleDate: today(),
};

function getRemaining(s) { return s.totalBought - s.used; }
function getBadge(rem) {
  if (rem <= 0) return '<span class="badge badge-zero">已用完</span>';
  if (rem <= 2) return '<span class="badge badge-low">剩 '+rem+' 堂</span>';
  return '<span class="badge badge-ok">剩 '+rem+' 堂</span>';
}
function switchTab(t) {
  state.tab = t; state.view = 'list';
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  render();
}
function render() {
  const c = document.getElementById('main-content');
  if (state.tab === 'students') {
    state.view === 'detail' && state.selectedStudent ? renderDetail(c) : renderList(c);
  } else if (state.tab === 'schedule') {
    renderSchedule(c);
  } else if (state.tab === 'record') {
    renderRecord(c);
  } else {
    renderSettings(c);
  }
}

// ════ 學生列表 ════
function renderList(c) {
  const low = state.students.filter(s => getRemaining(s) <= 2).length;
  const keyword = state.search.trim();
  const filtered = keyword ? state.students.filter(s => s.name.includes(keyword)) : state.students;
  c.innerHTML = `
    <div class="metric-row">
      <div class="metric"><div class="metric-num">${state.students.length}</div><div class="metric-lbl">學生</div></div>

function renderSchedule(c) {
  const sel = state.scheduleDate, weekDates = getWeekDates(sel), todayStr = today();
  const weekCells = weekDates.map((d, i) => {
    const dayLabel = ['一','二','三','四','五','六','日'][i];
    const count = state.schedule.filter(x => x.date === d).length;
    const isToday = d === todayStr, isSel = d === sel;
    let cls = 'week-cell-num';
    if (isSel) cls += ' is-selected'; else if (count > 0) cls += ' has-class';
    if (isToday) cls += ' is-today';
    return `<div class="week-cell" onclick="selectScheduleDate('${d}')"><div class="week-cell-day">${dayLabel}</div>
      <div class="${cls}">${d.slice(8)}${(!isSel&&count>0)?'<span class="week-dot"></span>':''}</div></div>`;
  }).join('');
  const dayItems = state.schedule.filter(x=>x.date===sel).sort((a,b)=>(a.timeStart||'').localeCompare(b.timeStart||''));
  const itemsHtml = dayItems.length === 0 ? `<div class="empty-state" style="padding:20px 0">今天沒有排課</div>`
    : dayItems.map(item => {
        const stu = state.students.find(s=>s.id===item.studentId);
        return `<div class="schedule-item">
          <div class="schedule-time-col"><div class="schedule-time-start">${item.timeStart||'—'}</div><div class="schedule-time-end">${item.timeEnd?'至 '+item.timeEnd:''}</div></div>
          <div class="schedule-info"><div class="schedule-name">${item.studentName}</div>
            <div class="schedule-loc">${item.location||'未設定地點'} · 剩 ${stu?getRemaining(stu):'?'} 堂</div>
            ${item.note?`<div class="schedule-note">${item.note}</div>`:''}</div>
          <div class="schedule-actions">
            <button class="icon-btn" onclick="openEditSchedule('${item.id}')">✏️</button>
            <button class="icon-btn del" onclick="deleteScheduleItem('${item.id}')">🗑</button>
          </div></div>`;
      }).join('');
  c.innerHTML = `
    <div class="card">
      <div class="date-nav">
        <button class="date-nav-btn" onclick="shiftScheduleDate(-1)">‹</button>
        <div class="date-center">
          <div class="date-display">${sel.replace(/-/g,'/')}</div>
          <div class="date-weekday">週${'日一二三四五六'[new Date(sel+'T00:00:00').getDay()]}</div>
          ${sel!==todayStr?`<button class="today-btn" onclick="selectScheduleDate('${todayStr}')">回到今天</button>`:''}
        </div>
        <button class="date-nav-btn" onclick="shiftScheduleDate(1)">›</button>
      </div>
      <div class="week-grid">${weekCells}</div>
      <input type="date" class="input" value="${sel}" onchange="selectScheduleDate(this.value)" style="margin-bottom:0;font-size:14px;">
    </div>
    <div class="card">
      <div class="section-label">當天課表（${dayItems.length} 堂）</div>
      ${itemsHtml}
      <button class="btn btn-primary" style="margin-top:${dayItems.length?'10':'0'}px" onclick="openAddSchedule()">+ 新增排課</button>
    </div>`;
}

function saveAddSchedule() {
  const sid=parseInt(document.getElementById('sch-student').value);
  const stu=state.students.find(s=>s.id===sid);
  const date=document.getElementById('sch-date').value||state.scheduleDate;
  state.schedule.push({id:String(Date.now()),studentId:sid,studentName:stu?stu.name:'未知',
    date,timeStart:document.getElementById('sch-start').value,timeEnd:document.getElementById('sch-end').value,
    location:document.getElementById('sch-loc').value.trim(),note:document.getElementById('sch-note').value.trim()});
  saveSchedule(); state.scheduleDate=date; closeScheduleModal(); render(); showToast('✅ 排課已新增');
}
function saveEditSchedule(id) {
  const item=state.schedule.find(x=>x.id===id); if(!item)return;
  const sid=parseInt(document.getElementById('sch-student').value);
  const stu=state.students.find(s=>s.id===sid);
  Object.assign(item,{studentId:sid,studentName:stu?stu.name:item.studentName,
    date:document.getElementById('sch-date').value||item.date,
    timeStart:document.getElementById('sch-start').value,timeEnd:document.getElementById('sch-end').value,
    location:document.getElementById('sch-loc').value.trim(),note:document.getElementById('sch-note').value.trim()});
  saveSchedule(); state.scheduleDate=item.date; closeScheduleModal(); render(); showToast('✅ 排課已更新');

  state.schedule=state.schedule.filter(x=>x.id!==id);

// ════ 診斷 ════
async function runDiagnostic() {
  const btn = document.getElementById('diag-btn');
  const result = document.getElementById('diag-result');
  btn.disabled = true; btn.textContent = '⏳ 診斷中...';
  const token = getCfg(SK_NOTION_TOK), dbId = getCfg(SK_NOTION_DB);
  const steps = [];

  steps.push({ ok: !!token, label: 'Token 已填入', detail: token ? `已填入（${token.slice(0,8)}...）` : '請先填入 Token' });
  steps.push({ ok: !!dbId,  label: '資料庫 ID 已填入', detail: dbId ? `已填入（${dbId.slice(0,8)}...）` : '請先填入資料庫 ID' });

  if (!token || !dbId) {
    renderDiagResult(steps, '❌ 請先填入設定再診斷');
    btn.disabled = false; btn.textContent = '🔍 開始診斷 Notion 連線';
    return;
  }

  // 測試 API Route 是否可用
  result.innerHTML = `<div class="diag-box diag-ing">⏳ 測試伺服器 API...</div>`;
  let apiOk = false;
  try {
    const testRes = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: '/v1/users/me', method: 'GET', token }),
    });
    const testData = await testRes.json();
    if (testRes.status === 200) {
      apiOk = true;
      steps.push({ ok: true,  label: '伺服器 API 可用', detail: '✅ Vercel API Route 正常運作（無 CORS 問題）' });
      steps.push({ ok: true,  label: 'Token 有效', detail: `✅ 驗證成功` });
    } else if (testRes.status === 401) {
      steps.push({ ok: true,  label: '伺服器 API 可用', detail: '✅ Vercel API Route 正常運作' });
      steps.push({ ok: false, label: 'Token 有效', detail: '❌ Token 無效（401），請重新複製 Integration 的 Secret' });
    } else if (testRes.status === 404 && testData.error) {
      // API route 本身找不到（本地開發沒有 /api/notion）
      steps.push({ ok: false, label: '伺服器 API 可用', detail: '❌ 找不到 /api/notion。請確認：1) 已上傳 api/notion.js 到 GitHub 2) Vercel 已重新部署' });
      steps.push({ ok: false, label: 'Token 有效', detail: '⏭ 跳過（API 不可用）' });
    } else {
      steps.push({ ok: false, label: '伺服器 API 可用', detail: `❌ 回應 ${testRes.status}：${testData.message || testData.error || '未知'}` });
      steps.push({ ok: false, label: 'Token 有效', detail: '⏭ 跳過' });
    }
  } catch(e) {
    steps.push({ ok: false, label: '伺服器 API 可用', detail: '❌ 無法連到 /api/notion：' + e.message + '。請確認已上傳 api/notion.js' });
    steps.push({ ok: false, label: 'Token 有效', detail: '⏭ 跳過' });
  }

  // 測試資料庫
  if (apiOk) {
    result.innerHTML = `<div class="diag-box diag-ing">⏳ 測試資料庫 ID...</div>`;
    try {
      const dbRes = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: '/v1/databases/' + formatDbId(dbId), method: 'GET', token }),
      });
      const dbData = await dbRes.json();
      if (dbRes.status === 200) {
        steps.push({ ok: true, label: '資料庫 ID 有效', detail: `✅ 找到資料庫：「${dbData.title?.[0]?.plain_text || '（無標題）'}」` });
        const props = Object.keys(dbData.properties || {});
        const required = ['姓名', '剩餘堂數', '已上堂數', '購買堂數', '最後同步'];
        const missing = required.filter(f => !props.includes(f));
        steps.push(missing.length === 0
          ? { ok: true,  label: '資料庫欄位', detail: '✅ 所有必要欄位都存在' }
          : { ok: false, label: '資料庫欄位', detail: `⚠️ 缺少欄位：${missing.join('、')}` });
      } else if (dbRes.status === 404) {
        steps.push({ ok: false, label: '資料庫 ID 有效', detail: '❌ 找不到（404）。最常見原因：Integration 還沒加進資料庫 Connection！' });
      } else if (dbRes.status === 403) {
        steps.push({ ok: false, label: '資料庫 ID 有效', detail: '❌ 無存取權（403）。請到資料庫 ⋯ → Connections → 加入 Integration' });
      } else {
        steps.push({ ok: false, label: '資料庫 ID 有效', detail: `❌ HTTP ${dbRes.status}：${dbData.message||'未知'}` });
      }
    } catch(e) {
      steps.push({ ok: false, label: '資料庫 ID 有效', detail: '❌ ' + e.message });
    }
  }

  const allOk = steps.every(s => s.ok);
  renderDiagResult(steps, allOk ? '✅ 全部正常！可以進行同步' : '❌ 請依上方說明修正後重試');
  btn.disabled = false; btn.textContent = '🔍 重新診斷';
}

function renderDiagResult(steps, summary) {
  const allOk = steps.every(s => s.ok);
  document.getElementById('diag-result').innerHTML = `
    <div class="diag-box ${allOk?'diag-ok':'diag-err'}" style="margin-bottom:8px"><strong>${summary}</strong></div>
    ${steps.map(s=>`<div class="diag-step"><div class="diag-icon">${s.ok?'✅':'❌'}</div>
      <div class="diag-text"><strong>${s.label}</strong><br><span style="color:#636366">${s.detail}</span></div></div>`).join('')}
    ${!allOk?`<div class="diag-box diag-warn" style="margin-top:10px;font-size:12px">
      <strong>💡 最常見問題：Integration 沒加進資料庫</strong><br>
      Notion 資料庫頁面 → 右上角 <strong>⋯</strong> → <strong>Connections</strong> → 找到你的 Integration → <strong>Confirm</strong>
    </div>`:''}`;
}

// ════ Notion 同步 ════
async function findOrCreateNotionPage(student) {
  const dbId = formatDbId(getCfg(SK_NOTION_DB));
  const map = loadNotionMap();
  if (map[student.id]) return map[student.id];
  const data = await notionRequest('/v1/databases/'+dbId+'/query', 'POST', {filter:{property:'姓名',title:{equals:student.name}}});
  let pageId;
  if (data.results?.length > 0) {
    pageId = data.results[0].id;
  } else {
    const c = await notionRequest('/v1/pages', 'POST', {parent:{database_id:dbId},properties:{姓名:{title:[{text:{content:student.name}}]}}});
    pageId = c.id;
  }
  map[student.id] = pageId; saveNotionMap(map);
  return pageId;
}
async function updateNotionPage(student, pageId) {
  const rem = getRemaining(student);
  const ts = new Date().toISOString().slice(0,10)+' '+new Date().toTimeString().slice(0,5);
  await notionRequest('/v1/pages/'+pageId, 'PATCH', {properties:{
    '剩餘堂數':{number:rem}, '已上堂數':{number:student.used},
    '購買堂數':{number:student.totalBought}, '最後同步':{rich_text:[{text:{content:ts}}]}
  }});
}
function addSyncLog(name, ok, msg) {
  state.syncLog.unshift({name, ok, msg, time: new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})});
}
function setSyncStatus(elId, msg, type) {
  const el = document.getElementById(elId);
  if (el) el.innerHTML = `<div class="sync-status sync-${type}">${msg}</div>`;
}
async function syncOneNotion(sid) {
  const s = state.students.find(x=>x.id===sid);
  setSyncStatus('sync-status-'+sid, '⏳ 同步中...', 'ing');
  try {
    const pageId = await findOrCreateNotionPage(s);
    await updateNotionPage(s, pageId);
    addSyncLog(s.name, true);
    setSyncStatus('sync-status-'+sid, '✅ 已同步到 Notion', 'ok');
    showToast('✅ Notion 同步成功');
  } catch(e) {
    addSyncLog(s.name, false, e.message);
    setSyncStatus('sync-status-'+sid, '❌ '+e.message, 'err');
    showToast('❌ 同步失敗：'+e.message);
  }
}
async function syncAllNotion() {
  const prog = document.getElementById('sync-progress');
  const btn = document.getElementById('sync-all-btn');
  if (prog) prog.style.display = 'block';
  if (btn) btn.disabled = true;
  for (let i = 0; i < state.students.length; i++) {
    const s = state.students[i];
    const fill=document.getElementById('progress-fill'), txt=document.getElementById('progress-text');
    if(fill) fill.style.width=Math.round((i+1)/state.students.length*100)+'%';
    if(txt) txt.textContent=`同步 ${s.name}... (${i+1}/${state.students.length})`;
    try { await updateNotionPage(s, await findOrCreateNotionPage(s)); addSyncLog(s.name,true); }
    catch(e) { addSyncLog(s.name,false,e.message); }
  }
  if (prog) prog.style.display = 'none';
  if (btn) btn.disabled = false;
  render(); showToast('✅ Notion 全部同步完成');
}

// ════ AI 筆記 ════
async function generateNote(sid) {
  const s = state.students.find(x=>x.id===sid);
  const input = document.getElementById('note-input-'+sid), btn = document.getElementById('ai-btn-'+sid);
  if (!input.value.trim()) { alert('請先輸入今天的上課狀況'); return; }
  const antKey = getCfg(SK_ANT_KEY);
  if (!antKey) { alert('請先到「設定」分頁填入 Anthropic API Key'); return; }
  btn.textContent = '⏳ AI 整理中...'; btn.disabled = true;
  const prev = s.notes.slice(0,2).map(n=>n.text).join('\n');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'x-api-key':antKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514', max_tokens: 300,
        messages: [{ role:'user', content:'你是羽球教練助理。根據教練的口語描述，整理成簡短學習筆記（100字以內），格式：優點・待改進・下次重點。\n教練描述：'+input.value.trim()+'\n過去筆記：'+(prev||'無')+'\n只輸出筆記內容，不要加前言。' }]
      })
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || 'HTTP '+res.status); }
    const data = await res.json();
    s.notes.unshift({ date:today(), text:data.content?.[0]?.text||'整理失敗', ai:true });
    input.value = ''; saveStudents(); showToast('✅ AI 筆記整理完成');
  } catch(e) { alert('AI 連線失敗：'+e.message); }
  btn.textContent = '✨ AI 整理筆記'; btn.disabled = false; render();
}

// ════ 匯出 PDF ════
function exportPrint(sid) {
  const s = state.students.find(x=>x.id===sid), rem = getRemaining(s);
  let balance = 0;
  const rows = [...s.logs].reverse().map(l=>{ balance+=l.delta; return {...l,balance}; }).reverse();
  const warn = rem<=2 ? `<div style="background:#FCEBEB;color:#A32D2D;border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:13px;font-weight:600;">⚠️ 課堂即將用完，請盡快購課</div>` : '';
  const html = `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${s.name} 課堂紀錄</title>
  <style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:720px;margin:40px auto;padding:0 24px;color:#1c1c1e}h1{font-size:24px;font-weight:700;margin-bottom:4px}.sub{color:#8e8e93;font-size:13px;margin-bottom:28px}.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px}.metric{background:#f2f2f7;border-radius:10px;padding:14px;text-align:center}.metric-num{font-size:28px;font-weight:700}.metric-lbl{font-size:11px;color:#8e8e93;margin-top:4px}.rem-ok{color:#3B6D11}.rem-low{color:#A32D2D}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th{background:#185FA5;color:#fff;padding:9px 10px;text-align:left;font-weight:600}td{padding:9px 10px;border-bottom:1px solid #f2f2f7}tr:nth-child(even) td{background:#f9f9f9}.plus{color:#3B6D11;font-weight:600}.minus{color:#A32D2D;font-weight:600}.footer{margin-top:36px;color:#c7c7cc;font-size:11px;text-align:center;border-top:1px solid #f2f2f7;padding-top:16px}.print-btn{display:block;margin:0 auto 24px;padding:10px 28px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600}@media print{.print-btn{display:none}body{margin:20px auto}}</style></head><body>
  <button class="print-btn" onclick="window.print()">🖨️ 列印 / 存成 PDF</button>
  <h1>${s.name} 課堂紀錄</h1><div class="sub">製表日期：${today()}</div>
  <div class="metrics"><div class="metric"><div class="metric-num">${s.totalBought}</div><div class="metric-lbl">購買課堂</div></div><div class="metric"><div class="metric-num">${s.used}</div><div class="metric-lbl">已上課堂</div></div><div class="metric"><div class="metric-num ${rem<=2?'rem-low':'rem-ok'}">${rem}</div><div class="metric-lbl">剩餘課堂</div></div></div>${warn}
  <table><thead><tr><th>#</th><th>姓名</th><th>日期</th><th>開始</th><th>結束</th><th>地點</th><th>消耗</th><th>剩餘</th></tr></thead>
  <tbody>${rows.map((l,i)=>`<tr><td>${l.type==='上課'?(i+1):''}</td><td>${s.name}</td><td>${l.date}</td><td>${l.timeStart||'—'}</td><td>${l.timeEnd||'—'}</td><td>${l.location||(l.type==='購課'?'購課':'—')}</td><td class="${l.delta>0?'plus':'minus'}">${l.delta>0?'+':''}${l.delta}</td><td>${l.balance}</td></tr>`).join('')}</tbody></table>
  <div class="footer">此紀錄由羽球教練助理產生</div></body></html>`;
  try {
    const blob=new Blob([html],{type:'text/html;charset=utf-8'}), url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  } catch(e) { const win=window.open('','_blank'); if(win){win.document.write(html);win.document.close();}else showToast('⚠️ 請允許彈出視窗'); }
}

// ════ 操作函式 ════
function saveAntKey() {
  const raw = document.getElementById('ant-key-input').value.trim();
  if (raw.includes('•')) { showToast('⚠️ Key 未變更'); return; }
  if (!raw.startsWith('sk-ant-')) { showToast('❌ 格式不對，應以 sk-ant- 開頭'); return; }
  setCfg(SK_ANT_KEY, raw); showToast('✅ API Key 已儲存'); render();
}
function saveNotionCfg() {
  const tok = document.getElementById('notion-tok-input').value.trim();
  const db  = document.getElementById('notion-db-input').value.trim();
  if (!tok.includes('•') && tok) setCfg(SK_NOTION_TOK, tok);
  if (db) setCfg(SK_NOTION_DB, db);
  showToast('✅ Notion 設定已儲存'); render();
}
function saveMemo(id) {
  const s=state.students.find(x=>x.id===id);
  s.memo=document.getElementById('memo-input-'+id).value.trim();
  saveStudents(); render();
}
function deleteStudent(id) {
  const s=state.students.find(x=>x.id===id);
  if(!confirm('確定要刪除「'+s.name+'」的所有資料嗎？\n此動作無法復原。'))return;
  state.students=state.students.filter(x=>x.id!==id);
  saveStudents(); state.view='list'; state.selectedStudent=null; render();
}
function openStudent(id) { state.selectedStudent=id; state.view='detail'; render(); }
function goBack() { state.view='list'; state.selectedStudent=null; render(); }
function addLesson(id) {
  const s=state.students.find(x=>x.id===id);
  if(getRemaining(s)<=0){alert('課堂已用完，請先購課！');return;}
  s.used++;
  s.logs.unshift({date:today(),timeStart:nowTime(),timeEnd:'',location:'',type:'上課',delta:-1});
  saveStudents(); render();
}
function addPurchase(id) {
  const s=state.students.find(x=>x.id===id);
  s.totalBought+=10;
  s.logs.unshift({date:today(),timeStart:'',timeEnd:'',location:'',type:'購課',delta:10});
  saveStudents(); render();
}
function addStudent() {
  const name=prompt('學生姓名：'); if(!name)return;
  const bought=parseInt(prompt('購買堂數：')||'10');
  state.students.push({id:Date.now(),name,initials:name.slice(-1),totalBought:bought,used:0,memo:'',
    logs:[{date:today(),timeStart:'',timeEnd:'',location:'',type:'購課',delta:bought}],notes:[]});
  saveStudents(); render();
}
function doRecord() {
  const id=parseInt(document.getElementById('rec-student').value);
  const s=state.students.find(x=>x.id===id);
  const count=parseInt(document.getElementById('rec-count').value)||1;
  if(getRemaining(s)<count){alert('課堂不足！');return;}
  s.used+=count;
  s.logs.unshift({date:document.getElementById('rec-date').value,
    timeStart:document.getElementById('rec-time-start').value||'',
    timeEnd:document.getElementById('rec-time-end').value||'',
    location:document.getElementById('rec-location').value.trim(),type:'上課',delta:-count});
  saveStudents(); showToast('✅ 已記錄 '+s.name+' 上課 '+count+' 堂'); render();
}
function doPurchase() {
  const id=parseInt(document.getElementById('buy-student').value);
  const s=state.students.find(x=>x.id===id);
  const count=parseInt(document.getElementById('buy-count').value)||10;
  s.totalBought+=count;
  s.logs.unshift({date:document.getElementById('buy-date').value||today(),
    timeStart:'',timeEnd:'',location:document.getElementById('buy-location').value.trim(),type:'購課',delta:count});
  saveStudents(); showToast('✅ 已為 '+s.name+' 新增 '+count+' 堂'); render();
}

render();
